services:
  db:
    image: postgres:16-alpine
    container_name: control_1c_version_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_1c_version
    ports:
      - "5433:5432"
    volumes:
      - control_1c_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_1c_version"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  control_1c_pgdata:
