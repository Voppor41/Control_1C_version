services:
  db:
    image: postgres:16-alpine
    container_name: control_1c_version_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_1c_version
    ports:
      - "5433:5432"
    volumes:
      - control_1c_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_1c_version"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: control_1c_version_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/control_1c_version
      ENVIRONMENT: dev
      DEBUG: "false"
      SEED_DEMO: "true"
      JWT_SECRET: dev-only-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: "720"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: ./frontend
    container_name: control_1c_version_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  control_1c_pgdata:
